name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Tests (logic + CLI)
        run: node --test
      - name: CLI smoke test (exit code must match the tier)
        shell: bash
        run: |
          node skills/deepseek-pricing-tier/scripts/deepseek_tier.mjs --at 2026-10-12T09:30:00+08:00 --json | grep -q '"tier": "peak"'
          node skills/deepseek-pricing-tier/scripts/deepseek_tier.mjs --at 2026-10-02T10:00:00+08:00 --json | grep -q '"reason": "public holiday"'
