name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Tests (logic + CLI)
        run: node --test
      - name: CLI smoke test (exit code must match the tier)
        shell: bash
        run: |
          # The CLI exits 3 for peak / 0 for off-peak by design, so capture the code
          # instead of letting GitHub's `set -e -o pipefail` turn it into a failure.
          rc=0
          node skills/deepseek-pricing-tier/scripts/deepseek_tier.mjs --at 2026-10-12T09:30:00+08:00 --quiet || rc=$?
          test "$rc" -eq 3
          rc=0
          node skills/deepseek-pricing-tier/scripts/deepseek_tier.mjs --at 2026-10-12T12:30:00+08:00 --quiet || rc=$?
          test "$rc" -eq 0
          node skills/deepseek-pricing-tier/scripts/deepseek_tier.mjs --at 2026-10-02T10:00:00+08:00 --json | grep -q '"reason": "public holiday"'
      - name: The desktop shell must embed the current panel
        run: node desktop/tools/sync-panel.mjs --check
