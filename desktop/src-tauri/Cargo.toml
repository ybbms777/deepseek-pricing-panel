[package]
name = "deepseek-pricing-panel"
version = "0.1.0"
description = "DeepSeek API peak/off-peak pricing panel (desktop shell)"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
